# Family registry — the single source of truth for who exists.
#
# One entry per member. Adding member #2 is: download weights, add an
# entry here, write a spec file. No code change (V2 doc, Section 4.1).
#
# Validated at hub startup by core/family.py; unknown keys, duplicate
# ids, or a missing spec file are hard startup failures.

# Staff, not family (Sprint 6 R1): the concierge has no private memory
# scope, no promotion rights, and never appears in GET /family. Model
# pick per decision 4 (dense ~8B, Q5, 4070-resident) — swap the entry,
# not the code, if a better sub-10GB model ships.
concierge:
  id: "jeffery"
  display_name: "Jeffery"
  spec_file: "family/jeffery/spec.md"
  model:
    source: "hf:Qwen/Qwen3-8B-Instruct"
    format: "gguf"
    quant: "Q5_K_M"
    context_length: 8192
  runtime:
    offload_policy: "vram_then_ram"
    sampling_defaults:
      temperature: 0.3
      top_p: 0.9

members:
  - id: "vera"
    display_name: "Vera"
    spec_file: "family/vera/spec.md"
    model:
      source: "hf:Qwen/Qwen3-30B-A3B-Instruct-2507"
      format: "gguf"
      quant: "Q4_K_M"
      context_length: 32768
    runtime:
      offload_policy: "vram_then_ram"
      sampling_defaults:
        temperature: 0.7
        top_p: 0.9
    memory:
      collection: "member_vera"
    storage_tier_hint: "hot"
